# de kaart. Individuele openbare apotheken (~1.970) parkeren we —
# Roel pakt eventueel een praktijkbestand er later bij.
#
# Elke keten krijgt één punt op zijn hoofdkantoor. Systemen
# (Pharmacom, CGM Aposys) zijn bewust NIET geseed: de keten zelf
# gebruikt vaak iets anders dan zijn aangesloten apotheken.
#
# Bron: claude-knowledge-2026-04. confidence: low, needs_verification: true.

