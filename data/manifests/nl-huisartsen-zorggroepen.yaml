# Manifest: huisartsen-zorggroepen NL — Sprint 4 coarse ingest
#
# Doel: de grote regionale huisartsen-zorggroepen (InEen-leden) op de
# kaart, één punt per hoofdkantoor. Utrecht provincie-zorggroepen zitten
# al in utrecht-v1.yaml (HUS, HzT, RHGV, huisartsen-eemland, Unicum, HUW,
# leidsche-rijn-julius-gc, zorggroep-regio-amersfoort).
#
# Individuele huisartspraktijken (~4.800) parkeren we — Roel voegt z'n
# eigen praktijk-bestand later toe als aparte fijnmazige laag.
#
# Bron: claude-knowledge-2026-04. confidence: low, needs_verification: true.
# HIS-info (Medicom/Promedico/TetraHIS/CGM) bewust niet geseed — komt in
# Sprint 4b na validatie.

version: 1
default_source: claude-knowledge-2026-04
default_confidence: low
