# Manifest: NL-coarse — revalidatie, GGD, RAV, grote GGZ
#
# Doel: de sectoren waar landelijk < 100 organisaties actief zijn
# compleet op de kaart krijgen. Utrecht-tegenhangers (de-hoogstraat,
# ggdru, ravu, altrecht, ggz-centraal, victas) zitten in
# data/manifests/utrecht-v1.yaml en worden door de importer geSKIPt.
#
# Niet in dit bestand (parked voor Sprint 5, te grote lijsten of
# onbetrouwbare LLM-seed):
#   - Jeugdhulpregio's (42, VNG)
#   - VSV's (~75)
#   - Gecertificeerde Instellingen jeugd (15, deels gemerged)
#   - Apotheekketens (5 relevante, te fragmentair voor een seed)
#
# Bron: claude-knowledge-2026-04, confidence: low, needs_verification: true.

version: 1
default_source: claude-knowledge-2026-04
default_confidence: low
