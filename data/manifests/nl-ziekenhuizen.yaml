# Manifest: alle Nederlandse ziekenhuizen — Sprint 3 NL-coarse ingest
#
# Doel: elke MSZ-instelling in NL op de kaart, incl. UMC's, STZ,
# algemene, en enkele categoralen. <100 stuks → past binnen de
# "100-regel" (alle items landelijk, niet alleen Utrecht).
#
# Bron: claude-knowledge-2026-04 (LLM-seed).
#   → confidence: low, needs_verification: true voor alles.
# Roel valideert per org via zijn NVZ-netwerk; overrides landen
# in data/overrides/<regio>.yaml met harde URL als source.
#
# Region_iza is meestal NIET gezet (regionale koppeling is Sprint 5).
# Uitzondering: de Utrechtse ziekenhuizen zijn GEEN dubbele entry
# hier — die zitten in data/manifests/utrecht-v1.yaml.
#
# Coordinaten: WGS84 (lat, lon). Hoofdlocatie van het ziekenhuis.
# Waar een ziekenhuis meerdere locaties heeft, neem ik de eerste
# stad op als primair punt en eventueel een tweede als 2e location.

version: 1
default_source: claude-knowledge-2026-04
default_confidence: low
default_needs_verification: true

entities:

