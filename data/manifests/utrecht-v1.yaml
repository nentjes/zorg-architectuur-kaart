# Manifest: provincie Utrecht — Sprint 3 fine-grained ingest
#
# Doel: alle IZA-relevante zorg-organisaties in de provincie Utrecht
# op de kaart krijgen, met systeem-/netwerk-info waar bekend.
# Region: iza-midden-nederland (Trijn).
#
# Bron: claude-knowledge-2026-04 (LLM-seed).
#   → confidence: low, needs_verification: true voor alles.
# Waar Roel handmatige kennis heeft (HIS, ECD, EPD) komt dat in
# data/overrides/utrecht.yaml en wint van dit manifest.
#
# Coordinaten: WGS84 (lat, lon). Centrum van de hoofdplaats.
# IJzeren regel: alleen entities die ten minste 1 IZA-rol vervullen
# (zorgaanbieder, gemeente als Wmo/jeugd-opdrachtgever, koepel).

