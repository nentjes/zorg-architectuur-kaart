id: uc-acp-in-de-keten
type: usecase
name: "Advance Care Planning in de keten"
description: >
  Een patiënt legt samen met de behandelend arts zijn/haar
  behandelwensen en -grenzen vast (Advance Care Planning / ACP),
  en deze wensen zijn vervolgens voor iedere betrokken zorgverlener
  in de keten — huisarts, HAP, ambulance, SEH, ziekenhuis, VVT —
  op het moment van zorgverlening beschikbaar. Doel: voorkomen
  van onbedoelde opnames, behandelingen of reanimaties die strijdig
  zijn met de wens van de patiënt.

  Landelijke basis: de richtlijn Proactieve Zorgplanning van PZNL
  (Palliatieve Zorg Nederland). Operationele pilot: Stichting
  CareCodex in de regio Twente werkt aan uniform digitaliseren en
  herkenbaar overdragen van ACP-gegevens tussen ketenpartners.
  't Gezond Gooi noemt ACP als één van de negen klantreizen zonder
  systeemaanwijzing — daar staat de use case nog op level 1 (Papier).
