name: "IZA-routekaart MSZ — Thema 3: Hybride zorg"
description: >
  Derde thema van de IZA-Digitaliseringsroutekaart medisch-specialistische
  zorg: transformatie naar hybride zorg — een mix van fysieke en digitale
  zorgcontacten, ondersteund door tele­monitoring, videoconsulten, en
  digitale patiënt­instructies. De ambitie: meer passende zorg en
  betere capaciteit­benutting door fysieke consulten alleen daar in te
  zetten waar ze toegevoegde waarde hebben.
