name: "IZA-routekaart MSZ — Thema 4: Secundair datagebruik"
description: >
  Vierde thema van de IZA-Digitaliseringsroutekaart medisch-specialistische
  zorg: data wordt in het zorg­proces digitaal, uniform en gestandaardiseerd
  vastgelegd en vervolgens beschikbaar gesteld voor diverse secundaire
  doelen — wetenschappelijk onderzoek, kwaliteits­registraties, populatie-
  management, beleids­analyse. Vereist 'once-only registratie' aan de bron
  en alignment met bewerkings­kaders als het European Health Data Space
  (EHDS) secundary-use-regime.
