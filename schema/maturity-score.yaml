    question: >
      Transport-paradigm mapping: klopt Claude's interpretatie van
      fhir_api / xds_network / lsp / secure_email zoals in
      `transport_paradigm_mapping` hierboven?
  - id: maturity-2
    question: >
      Data-type gewichten — welke volgorde en welke numerieke
      waardes? Claude's voorstel staat als comment in sectie 4.
  - id: maturity-3
    question: >
      Status multipliers voor `concept`, `deprecated`, `inactive`?
      Claude's voorstel: 0.05 / 0.0 / 0.0.
  - id: maturity-4
    question: >
      Recency decay: lineair of stapsgewijs? Voorstel: geen decay
      tot 12 maanden, daarna 1/24 per maand tot 0 bij 36 maanden.
  - id: maturity-5
    question: >
      Standaard-conformiteit bonus: hoeveel (×1.15?), en hoe precies
      vaststellen welke standaard telt?
