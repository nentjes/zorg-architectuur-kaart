# /sources/sources.yaml
#
# Het bronnenregister is de single source of truth voor elke bron die
# via `sources: [<id>]` in /data/**/*.yaml wordt gerefereerd. Zonder
# entry hier is een entity niet valide — dat is de kern van de
# bronverplichting uit README.md en /schema/entities.md.
#
# Structuur per bron:
#   id              kebab-case identifier, matcht /schema/schema.yaml::id
#   title           volledige titel van het document / de pagina
#   publisher       naam van de uitgevende partij
#   publisher_type  overheid | samenwerkingsverband | leverancier
#                   | onderzoek | media | standaardisatie-organisatie
#                   | community
#   date            publicatiedatum (YYYY-MM-DD); "YYYY" of "onbekend"
#                   mag als exacte datum niet vast staat
#   url             directe publieke URL (https). Als we de canonieke
#                   URL nog niet hebben gevonden: laat leeg en zet
#                   url_todo: true
#   url_todo        true als de URL nog gevalideerd moet worden
#   retrieved_at    YYYY-MM-DD waarop de huidige versie binnengehaald is
#   source_type     wet | regeling | plan | rapport | website | artikel
#                   | standaard | dataset | persbericht
#   access          openbaar | openbaar_via_pdf | achter_login
#                   | niet_openbaar
#   file_in_repo    relatief pad naar een kopie in /referenties/ indien
#                   we die hebben (optioneel)
#   license         CC-BY-4.0 | publiek_domein | onbekend | overig
#   notes           vrije tekst, bijv. versie-nummer, concept-status
#
# Regels (handmatig én via governance-bron-validator):
# - `id` is uniek
# - minstens één van {url, file_in_repo} moet gevuld zijn
# - een bron waar `url_todo: true` EN geen file_in_repo staat is
#   tijdelijk toegestaan in v0.2, maar blokkeert in v0.3
# - leverancier-PR's mogen niet de enige bron zijn voor
#   IMPLEMENTS_STANDARD-claims (zie relations.md)

